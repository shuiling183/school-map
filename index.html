<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上海初中学校分布地图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;height:100vh;overflow:hidden}
#loginPage{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
.login-box{background:rgba(255,255,255,0.05);padding:50px 40px;border-radius:16px;text-align:center;border:1px solid rgba(255,255,255,0.1)}
.login-box h1{color:#fff;font-size:24px;margin-bottom:20px}
.login-box input{padding:12px 20px;width:280px;background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:8px;font-size:16px;outline:none;text-align:center}
.login-box button{margin-top:15px;padding:12px 40px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;width:280px}
.login-box .hint{color:#666;font-size:12px;margin-top:15px}
#mapPage{display:none;flex-direction:column;height:100vh}
#topBar{background:#1a1a2e;padding:6px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#topBar .logo{color:#fff;font-size:13px;font-weight:bold;margin-right:5px;white-space:nowrap}
#topBar input{padding:5px 8px;background:#16213e;color:#eee;border:1px solid #333;border-radius:4px;font-size:12px;width:120px}
#topBar select{padding:5px 8px;background:#16213e;color:#eee;border:1px solid #333;border-radius:4px;font-size:12px}
#topBar button{padding:5px 10px;border:none;border-radius:4px;cursor:pointer;font-size:11px;color:#fff;white-space:nowrap}
#topBar .sep{color:#444;margin:0 2px}
#mapContainer{flex:1}
#infoBar{background:#1a1a2e;padding:5px 10px;color:#aaa;font-size:11px;display:flex;align-items:center;gap:8px}
#infoBar a{color:#2ecc71;text-decoration:none}
#infoBar .hint{color:#888;font-size:10px}
#detailPanel{display:none;position:fixed;right:0;top:0;bottom:0;width:360px;background:rgba(26,26,46,0.97);color:#eee;overflow-y:auto;padding:15px;z-index:999;border-left:1px solid rgba(255,255,255,0.1)}
#detailPanel h3{font-size:15px;margin-bottom:10px}
#detailPanel p{font-size:12px;margin:4px 0;color:#aaa}
#detailPanel input,#detailPanel textarea{width:100%;padding:3px 6px;background:#16213e;color:#eee;border:1px solid #444;border-radius:3px;font-size:12px;margin:2px 0}
#detailPanel button{padding:5px 10px;margin:3px;border:none;border-radius:3px;cursor:pointer;font-size:12px;color:#fff}
.tier-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;color:#fff}
.t1{background:#e94560}.t2{background:#f39c12}.t3{background:#3498db}
</style>
</head>
<body>
<div id="loginPage"><div class="login-box"><h1>上海初中学校分布地图</h1><input type="password" id="pwdInput" placeholder="输入密码..." autofocus><br><button onclick="doLogin()">进入地图</button><p id="loginError" style="color:#e94560;display:none;margin-top:10px;">密码错误</p><p class="hint">密码: shanghai2026</p></div></div>
<div id="mapPage">
  <div id="topBar">
    <span class="logo">上海初中分布地图</span>
    <select id="districtFilter"><option value="">全部区域</option></select>
    <select id="tierFilter"><option value="">全部梯队</option><option value="一梯队">一梯队</option><option value="二梯队">二梯队</option><option value="三梯队">三梯队</option></select>
    <select id="typeFilter"><option value="">全部</option><option value="公办">公办</option><option value="民办">民办</option></select>
    <span class="sep">|</span>
    <input id="schoolSearch" placeholder="🔍 搜索学校..." title="搜索已标记的学校"><button onclick="clearSchoolSearch()" style="background:#e74c3c;padding:5px 8px;font-size:11px" title="清除搜索">✕</button>
    <input id="addrSearch" placeholder="📍 搜索地址..." title="在高德地图中搜索任意地址"><button onclick="cancelAddrSearch();document.getElementById('addrSearch').value='';renderSchools();" style="background:#e74c3c;padding:5px 8px;font-size:11px" title="清除地址搜索">✕</button>
    <button onclick="schoolSearchBtn()" style="background:#3498db" title="搜索已标记学校">搜学校</button>
    <button onclick="searchAddress()" style="background:#9b59b6" title="在高德地图搜索地址">搜地址</button>
    <span class="sep">|</span>
    <button onclick="startAddSchool()" style="background:#f39c12;font-weight:bold" title="在地图上新增一所学校">＋ 新增学校</button>
    <button onclick="toggleFavFilter()" id="favBtn" style="background:#555">⭐ 只看收藏</button>
    <button onclick="exportCSV()" style="background:#2ecc71">📥 导出</button><button onclick="cloudSave()" style="background:#f39c12;font-size:10px">☁存</button><button onclick="cloudLoad()" style="background:#3498db;font-size:10px">☁取</button><button onclick="setSyncToken()" style="background:#555;font-size:9px">🔑Token</button>
  </div>
  <div id="mapContainer"></div>
  <div id="infoBar">
    <span id="schoolCount"></span>
    <span class="hint" title="用高德地理编码将学校地址转为精确经纬度">📍校正坐标</span>
    <a href="#" onclick="startGeocoding(false)" class="hint" style="color:#2ecc71">▶开始</a>
    <span class="hint" title="清除已校正的坐标缓存，恢复为区域中心近似位置（坐标重启自动保留）">🔄清除缓存</span>
    <a href="#" onclick="localStorage.removeItem('geo44');location.reload()" class="hint" style="color:#e94560">▶执行</a>
  </div>
  <div id="detailPanel"><div id="detailContent"></div></div>
</div>
<script>window._AMapSecurityConfig={securityJsCode:"699e495168e30b5c0dc90291b04836d1"};</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=fd6164c500d567b965a18497e92139d9&plugin=AMap.Geocoder,AMap.PlaceSearch,AMap.DistrictSearch"></script>
<script src="schools_data.js?v=54"></script>
<script src="app.js?v=54"></script>
</body>
</html>
