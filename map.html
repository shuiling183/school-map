<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><title>Map Test</title>
<style>body{margin:0}#map{width:100%;height:100vh}</style>
</head>
<body>
<div id="map"></div>
<script>
window._AMapSecurityConfig={securityJsCode:'699e495168e30b5c0dc90291b04836d1'};
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=fd6164c500d567b965a18497e92139d9"></script>
<script>
var map=new AMap.Map('map',{zoom:12,center:[121.47,31.23]});
// Add a red circle marker
var cm=new AMap.CircleMarker({center:[121.47,31.23],radius:10,fillColor:'#e94560',fillOpacity:0.9,strokeColor:'#fff',strokeWeight:2});
cm.setMap(map);
// Add text label
var txt=new AMap.Text({text:'测试标记',position:[121.47,31.23],offset:new AMap.Pixel(0,15),style:{'font-size':'14px','color':'#222','font-weight':'bold','text-shadow':'0 0 3px #fff'}});
txt.setMap(map);
</script>
</body>
</html>
